metis_engine:
  max_token_length: 250000
  max_workers: 5
  triage_checkpoint_every: 50
  review_checkpoints: true
  llm_max_retries: 5
  embed_dim: 3072
  model_tools:
    max_rounds: 6
    max_contract_chars: 6000
  # Capability settings
  capabilities:
    index:
      search:
        max_top_k: 4
        code_top_k: 1
        docs_top_k: 4
        docs_char_ratio: 1.0
        default_max_chars: 5000
        max_chars: 7000
    navigation:
      timeout_seconds: 8
      max_chars: 16000
  threat_model:
    source_patterns:
      - "SECURITY.*"
      - "THREAT_MODEL.*"
      - "THREATMODEL.*"
      - "threat_model.*"
      - ".github/SECURITY.*"
      - "docs/SECURITY.*"
      - "docs/THREAT_MODEL.*"
      - "docs/threat_model.*"
      - "docs/**/*threat*model*.*"
    history:
      enabled: false
      max_commits: 500
  execution:
    inputs:
      review_request:
        mode: code
    stages:
      initialize:
        outputs:
          threat_model: threat_model.threat_model
          codegraph: codegraph.codegraph
        nodes:
          threat_model:
            capabilities:
              - memory
          codegraph: {}
      review:
        inputs:
          codegraph: initialize.codegraph
        nodes:
          simple_llm_review:
            capabilities:
              - memory
          reachability:
            capabilities:
              - memory
          finding_dedup: {}
          result:
            formats:
              - sarif
      triage:
        inputs:
          sarif: review.sarif
          codegraph: initialize.codegraph
        nodes:
          triage:
            capabilities:
              - memory
              - navigation
          result:
            formats:
              - sarif
  codegraph:
    source_functions: []
    security_functions: []
  reachability:
    max_path_length: 25
    domain_profiles: []
    domain_hints: []

memory:
  backend: "sqlite"
  location: ".metis/memory/metis_memory.sqlite3"

llm_provider:
  name: "openai"
  model: "gpt-5.5"
  # Optional for reasoning-capable models: use a value supported by the
  # configured provider/model. Can be overridden under query.
  # reasoning_effort: "medium"

# Needed only when the selected execution path uses the index capability.
embedding_provider:
  name: "openai"
  code_embedding_model: "text-embedding-3-large"
  docs_embedding_model: "text-embedding-3-large"

query:
  similarity_top_k: 5
  max_tokens: 5000
  temperature: 0.0
