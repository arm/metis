[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.0.0" ]

[project]
name = "metis"
version = "1.5.0"
description = "Metis is a command line tool for performing security code reviews using LLMs"
readme = "README.md"
keywords = [ "code-review", "llm", "security" ]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "chromadb>=1.5.9",
  "langchain==1.4.2",
  "langchain-core==1.6.4",
  "langchain-openai==1.6.3",
  "langgraph==1.2.12",
  "langsmith==0.14.0",
  "llama-index>=0.14.25",
  "llama-index-vector-stores-chroma>=0.6.0",
  "pathspec>=1.1.1",
  "prompt-toolkit>=3.0.53",
  "pydantic>=2.13.5",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "tree-sitter==0.25.2",
  "tree-sitter-language-pack==1.8.1",
  "unidiff>=1.0.1",
]
optional-dependencies.all-providers = [
  "metis[anthropic,bedrock,bedrock-mantle,gemini]",
]
optional-dependencies.anthropic = [
  "langchain-anthropic>=1.7.2",
  "llama-index-llms-langchain>=0.9.0",
]
optional-dependencies.azure = []
optional-dependencies.bedrock = [
  "boto3>=1.43.99",
  "langchain-aws>=1.7.9",
]
optional-dependencies.bedrock-mantle = [
  "anthropic[aws]>=1.7.0",
  "boto3>=1.43.99",
  "langchain-anthropic>=1.7.2",
  "llama-index-llms-langchain>=0.9.0",
]
optional-dependencies.dev = [
  "metis[all-providers]",
  "metis[lint]",
  "metis[qdrant]",
  "metis[test]",
]
optional-dependencies.gemini = [
  "langchain-google-genai>=4.4.0",
]
optional-dependencies.lint = [
  "bandit>=1.9.4",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "ruff>=0.16.8",
]
optional-dependencies.postgres = [
  "llama-index-vector-stores-postgres>=0.9.0",
]
optional-dependencies.qdrant = [
  "llama-index-vector-stores-qdrant>=0.10.3",
  "qdrant-client<1.19",
]
optional-dependencies.test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "setuptools>=82.0.1",
]
scripts.metis = "metis.cli.entry:main"
entry-points."metis.providers"."anthropic.chat" = "metis.providers.anthropic:AnthropicProvider"
entry-points."metis.providers"."azure_openai.chat" = "metis.providers.azure_openai:AzureOpenAIProvider"
entry-points."metis.providers"."azure_openai.embedding" = "metis.providers.azure_openai:AzureOpenAIEmbeddingProvider"
entry-points."metis.providers"."bedrock.chat" = "metis.providers.bedrock:BedrockProvider"
entry-points."metis.providers"."bedrock.embedding" = "metis.providers.bedrock:BedrockEmbeddingProvider"
entry-points."metis.providers"."bedrock_mantle.chat" = "metis.providers.bedrock_mantle:BedrockMantleProvider"
entry-points."metis.providers"."gemini.chat" = "metis.providers.gemini:GeminiProvider"
entry-points."metis.providers"."llamacpp.chat" = "metis.providers.llamacpp:LlamaCppProvider"
entry-points."metis.providers"."llamacpp.embedding" = "metis.providers.llamacpp:LlamaCppEmbeddingProvider"
entry-points."metis.providers"."ollama.chat" = "metis.providers.ollama:OllamaProvider"
entry-points."metis.providers"."ollama.embedding" = "metis.providers.ollama:OllamaEmbeddingProvider"
entry-points."metis.providers"."openai.chat" = "metis.providers.openai:OpenAIProvider"
entry-points."metis.providers"."openai.embedding" = "metis.providers.openai:OpenAIEmbeddingProvider"
entry-points."metis.providers"."vllm.chat" = "metis.providers.vllm:VLLMProvider"
entry-points."metis.providers"."vllm.embedding" = "metis.providers.vllm:VLLMEmbeddingProvider"

[tool.setuptools]
include-package-data = true
package-data."metis.cli" = [ "report_template.html" ]
package-data."metis.engine" = [ "prompts/*.yaml" ]
package-data."metis.engine.capabilities.manifests" = [ "*.yaml" ]
package-data."metis.engine.tools.contracts" = [ "*.md" ]
package-data."metis.plugins" = [
  "config/*.yaml",
  "languages/*.yaml",
  "manifests/*.yaml",
  "profiles/*.yaml",
]
package-data."metis.plugins.config" = [ "*.yaml" ]
package-data."metis.plugins.languages" = [ "*.yaml" ]
package-data."metis.plugins.manifests" = [ "*.yaml" ]
package-data."metis.plugins.profiles" = [ "*.yaml" ]
package-data.metis = [ "metis.yaml" ]

[tool.ruff]
lint.select = [ "E4", "E7", "E9", "F" ]
lint.isort.force-single-line = true

[tool.pyproject-fmt]
keep_full_version = true
