psql_database:
  provider: "config"
  credentials:
    username: "metis_user"
    password: "metis_password"
    host: "localhost"
    port: 5432
    database_name: "metis_db"

metis_engine:
  model_tools:
    max_rounds: 6
    max_contract_chars: 6000
  capabilities:
    index:
      search:
        max_top_k: 4
        code_top_k: 1
        docs_top_k: 4
        docs_char_ratio: 1.0
        default_max_chars: 5000
        max_chars: 7000
    navigation:
      timeout_seconds: 8
      max_chars: 16000

  max_token_length: 250000
  max_workers: 5
  triage_checkpoint_every: 50
  embed_dim: 3072
  hnsw_kwargs:
    hnsw_m: 16
    hnsw_ef_construction: 64
    hnsw_ef_search: 40
    hnsw_dist_method: "vector_cosine_ops"

llm_provider:
  name: "anthropic"
  model: "opus"
  api_key_env: "ANTHROPIC_API_KEY"

# Optional — only needed when the index tool is enabled.
embedding_provider:
  name: "openai"
  code_embedding_model: "text-embedding-3-large"
  docs_embedding_model: "text-embedding-3-large"

query:
  similarity_top_k: 5
  response_mode: "tree_summarize"
  max_tokens: 5000
  temperature: 0.0
