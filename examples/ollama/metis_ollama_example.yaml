psql_database:
  provider: "config"
  credentials:
    username: "metis_user"
    password: "metis_password"
    host: "localhost"
    port: 5432
    database_name: "metis_db"

metis_engine:
  model_tools:
    max_rounds: 6
    max_contract_chars: 6000
  capabilities:
    index:
      search:
        max_top_k: 4
        code_top_k: 1
        docs_top_k: 4
        docs_char_ratio: 1.0
        default_max_chars: 5000
        max_chars: 7000
    navigation:
      timeout_seconds: 8
      max_chars: 16000

  max_token_length: 120000
  max_workers: 8
  embed_dim: 4096
  doc_chunk_size: 320
  doc_chunk_overlap: 64
  metisignore_file: .metisignore # you can also use .gitignore
  hnsw_kwargs:
    hnsw_m: 16
    hnsw_ef_construction: 64
    hnsw_ef_search: 40
    hnsw_dist_method: "vector_cosine_ops"

llm_provider:
  name: "ollama"
  base_url: "http://localhost:11434/v1"
  # Models recommendation depends on hardware capabilities
  model: "llama3.1:8b" # for 8GB system
#  model: "qwen3.5:9b" # for 16GB system
#  model: "qwen3.6:35b-a3b" # for 24GB system

# Optional — only needed when the index tool is enabled.
embedding_provider:
  name: "ollama"
  base_url: "http://localhost:11434/v1"
  code_embedding_model: "nomic-embed-text:v1.5"
  docs_embedding_model: "nomic-embed-text:v1.5"

query:
  similarity_top_k: 5
  max_tokens: 2048
  temperature: 0.0
