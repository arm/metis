metis_engine:
  model_tools:
    max_rounds: 6
    max_contract_chars: 6000
  capabilities:
    index:
      search:
        max_top_k: 4
        code_top_k: 1
        docs_top_k: 4
        docs_char_ratio: 1.0
        default_max_chars: 5000
        max_chars: 7000
    navigation:
      timeout_seconds: 8
      max_chars: 16000


  # Only review code inside the "backend" folder
  review_code_include_paths:
    - 'backend/'

  # Don't review dtos, schemas, tests...
  review_code_exclude_paths:
    - 'dto/'
    - '*.d.ts'
    - '*.spec.ts'
    - '*.fixture.ts'
    - '*.dto.ts'
    - '*.const.ts'
    - '*.interface.ts'
    - '*.model.ts'
    - '*.type.ts'
    - '*.request.ts'
    - '*.response.ts'
    - '*.response.api.ts'
    - '*.params.ts'
    - '*.schema.ts'
    - '*.mapper.ts'
    - '*.store.ts'
    - 'e2e_ssr/'
    - 'e2e/'
    - '*.e2e-spec.ts'
    - 'backend/test'
    - 'schema.ts'
